name: 'Cloud Leecher Engine'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      file_url:
        required: true
        type: string

      folder_name:
        required: true
        type: string

      safe_mode:
        required: true
        type: string

permissions:
  contents: write

jobs:
  leech:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3
        
      - name: Update yt-dlp
        run: |
          python3 -m pip install -U yt-dlp
          
      - name: Setup cookies (YouTube)
        run: |
          mkdir -p ~/.cache/yt-dlp/youtube
          echo "${{ secrets.YOUTUBE_COOKIES }}" > ~/.cache/yt-dlp/youtube/cookies.txt

      - name: Setup cookies (Pornhub)
        run: |
          mkdir -p ~/.cache/yt-dlp/pornhub
          echo "${{ secrets.PORNHUB_COOKIES }}" > ~/.cache/yt-dlp/pornhub/cookies.txt

      - name: Process File
        shell: bash
        run: |
          set -e

          URL="${{ github.event.inputs.file_url }}"
          FOLDER="${{ github.event.inputs.folder_name }}"
          SAFE_MODE="${{ github.event.inputs.safe_mode }}"

          download_direct() {
            echo "Detected direct file URL"

            RAW_NAME=$(basename "${URL%%\?*}" | sed 's/%20/ /g')
            NAME_NO_EXT="${RAW_NAME%.*}"
            URL_EXT="${RAW_NAME##*.}"

            if [ "$URL_EXT" = "$RAW_NAME" ]; then
              URL_EXT=""
            fi

            curl -L --fail --retry 5 \
              -A "Mozilla/5.0" \
              --progress-bar \
              -D headers.txt \
              -o "temp_download" \
              "$URL"

            SELECTED_EXT="$URL_EXT"
            if [ -z "$SELECTED_EXT" ]; then
              SELECTED_EXT="bin"
            fi
          }

          download_ytdlp() {
            echo "Detected YouTube/Pornhub URL"

            COOKIE_FILE="~/.cache/yt-dlp/youtube/cookies.txt"
            if [[ "$URL" == *"pornhub.com"* ]]; then
              COOKIE_FILE="~/.cache/yt-dlp/pornhub/cookies.txt"
            fi

            yt-dlp \
              --cookies "$COOKIE_FILE" \
              -f "bv*+ba/b" \
              --merge-output-format mp4 \
              --no-playlist \
              -o "temp_download.%(ext)s" \
              "$URL"

            DOWNLOADED_FILE=$(find . -maxdepth 1 -name "temp_download.*" | head -n 1)

            if [ -z "$DOWNLOADED_FILE" ]; then
              echo "yt-dlp failed"
              exit 1
            fi

            RAW_NAME=$(basename "$DOWNLOADED_FILE")
            NAME_NO_EXT="${RAW_NAME%.*}"
            SELECTED_EXT="${RAW_NAME##*.}"

            mv "$DOWNLOADED_FILE" temp_download
          }

          if [[ "$URL" == *"youtube.com"* || "$URL" == *"youtu.be"* || "$URL" == *"pornhub.com"* ]]; then
            download_ytdlp
          else
            download_direct
          fi

          if [ "$SAFE_MODE" == "true" ]; then
            FINAL_FILE="$FOLDER.$SELECTED_EXT"
          else
            FINAL_FILE="$NAME_NO_EXT.$SELECTED_EXT"
          fi

          mkdir -p wrap_dir
          mv "temp_download" "wrap_dir/$FINAL_FILE"

          cd wrap_dir
          zip -0 "../$FOLDER.zip" "$FINAL_FILE"
          cd ..

          mkdir -p "downloads/$FOLDER"

          split -b 90M -d -a 3 "$FOLDER.zip" "downloads/$FOLDER/chunk_"

          a=1
          for i in downloads/$FOLDER/chunk_*; do
            new=$(printf "downloads/$FOLDER/$FOLDER.zip.%03d" "$a")
            mv -- "$i" "$new"
            let a=a+1
          done

          git config user.name "OctoFetchBot"
          git config user.email "bot@octofetch.local"

          git pull origin main || true
          git add downloads/
          git commit -m "Add $FOLDER ZIP Archive" || echo "No changes"
          git push